name: Hello World

on:
  workflow_dispatch:
  push:
    branches: [ "main", "copilot/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  hello-world:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Print Hello World
        run: |
          echo "🌍 Hello World!"
          echo "======================================"
          echo "Welcome to the Android Hello World App"
          echo "======================================"
          echo ""
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run Number: ${{ github.run_number }}"
          echo ""
          echo "✅ Hello World workflow completed successfully!"
      
      - name: Show system information
        run: |
          echo "📊 System Information:"
          echo "OS: $(uname -s)"
          echo "Kernel: $(uname -r)"
          echo "Architecture: $(uname -m)"
          echo "Hostname: $(hostname)"
          echo "Current User: $(whoami)"
          echo "Current Directory: $(pwd)"
          echo "Date/Time: $(date)"
      
      - name: Create Hello World summary
        run: |
          echo "## 🌍 Hello World!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This is a simple Hello World GitHub Action workflow." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Workflow Details:" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Status:** Workflow completed successfully!" >> $GITHUB_STEP_SUMMARY
